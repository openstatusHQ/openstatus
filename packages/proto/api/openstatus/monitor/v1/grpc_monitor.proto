syntax = "proto3";

package openstatus.monitor.v1;

import "buf/validate/validate.proto";
import "gnostic/openapi/v3/annotations.proto";
import "openstatus/monitor/v1/http_monitor.proto";
import "openstatus/monitor/v1/monitor.proto";

option go_package = "github.com/openstatushq/openstatus/packages/proto/openstatus/monitor/v1;monitorv1";

// GRPCTlsMode selects how the probe secures its connection to the target.
enum GRPCTlsMode {
  // Unspecified. Treated as TLS on create; ignored on update.
  GRPC_TLS_MODE_UNSPECIFIED = 0;

  // Verify the server certificate against the system trust store.
  GRPC_TLS_MODE_TLS = 1;

  // Connect without TLS (h2c).
  GRPC_TLS_MODE_PLAINTEXT = 2;

  // Use TLS but do not verify the server certificate.
  GRPC_TLS_MODE_TLS_INSECURE = 3;
}

// GRPCMonitor defines the configuration for a gRPC health check monitor.
// The probe calls grpc.health.v1.Health/Check on the target.
message GRPCMonitor {
  // Unique identifier for the monitor (output only for create requests).
  string id = 1;

  // Name of the monitor (required, max 256 characters).
  string name = 2 [
    (buf.validate.field).string = {
      min_len: 1
      max_len: 256
    },
    (gnostic.openapi.v3.property) = {example: {yaml: "Checkout gRPC"}}
  ];

  // Target in "host:port" form. IPv6 addresses must be bracketed.
  string uri = 3 [
    (buf.validate.field).string = {
      min_len: 1
      max_len: 2048
      pattern: "^(\\[[0-9a-fA-F:]+\\]|[^:/\\s]+):[0-9]{1,5}$"
    },
    (gnostic.openapi.v3.property) = {example: {yaml: "api.example.com:443"}}
  ];

  // Check periodicity (required).
  Periodicity periodicity = 4 [(buf.validate.field).enum = {
    not_in: [0]
  }];

  // Timeout in milliseconds (0-120000, defaults to 45000).
  int64 timeout = 5 [(buf.validate.field).int64 = {
    gte: 0
    lte: 120000
  }];

  // Latency threshold for degraded status in milliseconds (optional, 0-120000).
  optional int64 degraded_at = 6 [(buf.validate.field).int64 = {
    gte: 0
    lte: 120000
  }];

  // Number of retry attempts (0-10, defaults to 3).
  int64 retry = 7 [(buf.validate.field).int64 = {
    gte: 0
    lte: 10
  }];

  // Description of the monitor (optional).
  optional string description = 8 [(buf.validate.field).string.max_len = 1024];

  // Whether the monitor is active (defaults to false).
  optional bool active = 9;

  // Whether the monitor is publicly visible (defaults to false).
  optional bool public = 10;

  // Geographic regions to run checks from.
  repeated Region regions = 11 [(buf.validate.field).repeated = {
    max_items: 28
    items: {
      enum: {
        not_in: [0]
      }
    }
  }];

  // OpenTelemetry configuration for exporting metrics.
  OpenTelemetryConfig open_telemetry = 12;

  // Current operational status of the monitor.
  MonitorStatus status = 13;

  // IDs of private locations that run this monitor. Read-only.
  repeated string private_location_ids = 14 [
    (gnostic.openapi.v3.property) = {read_only: true}
  ];

  // Service name passed to Health/Check. Empty means overall server health.
  optional string service = 15 [
    (buf.validate.field).string.max_len = 512,
    (gnostic.openapi.v3.property) = {example: {yaml: "checkout.v1.CheckoutService"}}
  ];

  // How the connection to the target is secured. Defaults to TLS.
  optional GRPCTlsMode tls_mode = 16;

  // Metadata sent with the health check request.
  repeated Headers metadata = 17 [(buf.validate.field).repeated.max_items = 20];
}
