{{- if not .Values.secrets.existingSecret }}
{{- $name := include "openstatus.secretName" . }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "openstatus.labels" . | nindent 4 }}
type: Opaque
data:
  AUTH_SECRET: {{ get $existing "AUTH_SECRET" | default (randAlphaNum 48 | b64enc) }}
  CRON_SECRET: {{ get $existing "CRON_SECRET" | default (randAlphaNum 32 | b64enc) }}
  {{- range $k, $v := .Values.secrets.extra }}
  {{ $k }}: {{ $v | toString | b64enc }}
  {{- end }}
{{- end }}
