packages:
  - apps/*
  - packages/**/*
  - packages/config/*
  - scripts/tutorials
  - scripts/videos
# pnpm 12 routes `@jsr` to npm.jsr.io by default when *resolving*, but the
# supply-chain policy pass (`trustPolicy` / `minimumReleaseAge` below) verifies
# every lockfile entry against the default registry, so the `@jsr/std__*`
# packages behind our `jsr:` specifiers 404 on a cold cache. Declaring the route
# here makes both passes agree.
registries:
  "https://npm.jsr.io/":
    scopes:
      - "@jsr"
trustPolicy: off
minimumReleaseAge: 1440
# Our own scope; we adopt our packages the day they ship.
minimumReleaseAgeExclude:
  - "@openstatus/*"
allowBuilds:
  "@bufbuild/buf": true
  "@parcel/watcher": true
  "@sentry/cli": true
  "@swc/core": true
  "@tailwindcss/oxide": true
  core-js-pure: true
  esbuild: true
  # Optional native accelerator for msgpackr (pulled in by effect). msgpackr
  # falls back to its pure-JS path without it, so skip the native build.
  msgpackr-extract: false
  msw: true
  protobufjs: true
  sharp: true
# @google-cloud/pubsub pins semantic-conventions ~1.39 while the @opentelemetry/core
# it shares with us resolves to the catalog's 1.45; the workflows side-car can only
# ship one copy. The package is constants only, and newer releases only add more.
# Its ~1.9 pin on @opentelemetry/api clashes the same way with the 1.10 that
# OTel sdk-logs 3 needs; api 1.x minors are backward compatible.
overrides:
  "@google-cloud/pubsub>@opentelemetry/semantic-conventions": 1.45.0
  "@google-cloud/pubsub>@opentelemetry/api": 1.10.0
autoInstallPeers: true
# `turbo` is deliberately pinned literally in package.json rather than listed
# here: Vercel can't read a version through `catalog:`, and on failing to infer
# it disables corepack and falls back to pnpm 9 — which ignores the `overrides`
# above and fails the frozen install.
