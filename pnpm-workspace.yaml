packages:
  - apps/*
  - packages/**/*
  - packages/config/*
# pnpm 12 routes `@jsr` to npm.jsr.io by default when *resolving*, but the
# supply-chain policy pass (`trustPolicy` / `minimumReleaseAge` below) verifies
# every lockfile entry against the default registry, so the `@jsr/std__*`
# packages behind our `jsr:` specifiers 404 on a cold cache. Declaring the route
# here makes both passes agree.
registries:
  "https://npm.jsr.io/":
    scopes:
      - "@jsr"
trustPolicy: off
minimumReleaseAge: 1440
# Our own scope; we adopt our packages the day they ship.
minimumReleaseAgeExclude:
  - "@openstatus/*"
allowBuilds:
  "@bufbuild/buf": true
  "@parcel/watcher": true
  "@sentry/cli": true
  "@swc/core": true
  "@tailwindcss/oxide": true
  core-js-pure: true
  esbuild: true
  # Optional native accelerator for msgpackr (pulled in by effect). msgpackr
  # falls back to its pure-JS path without it, so skip the native build.
  msgpackr-extract: false
  msw: true
  protobufjs: true
  sharp: true
autoInstallPeers: true
# `turbo` is deliberately pinned literally in package.json rather than listed
# here: Vercel can't read a version through `catalog:`, and on failing to infer
# it disables corepack and falls back to pnpm 9 — which ignores the `overrides`
# above and fails the frozen install.
