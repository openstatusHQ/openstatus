# fly.toml app configuration file generated for openstatus-checker on 2023-11-30T20:23:20+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "openstatus-checker"
primary_region = "ams"

[build]
  dockerfile = "./Dockerfile"

[deploy]
  strategy = "canary"


[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  processes = ["app"]

# No [[vm]] block on purpose: machine size is set per region with
# `fly machine update`, and [[vm]] can only be scoped per process group, so any
# block here would reset every machine to one size on `fly deploy`.
# Without it, deploys leave each machine's size alone.
#   shared-cpu-2x / 512MB: ams, cdg, iad, jnb, lhr, sjc, syd (7d avg CPU above the 1x baseline)
#   shared-cpu-1x / 512MB: every other region
# Keep memory at 512MB everywhere: 7d peaks reach ~300MB.


[[http_service.checks]]
  grace_period = "10s"
  interval = "15s"
  method = "GET"
  timeout = "5s"
  path = "/health"

[http_service.concurrency]
    type = "requests"
    hard_limit = 1000
    soft_limit = 500
