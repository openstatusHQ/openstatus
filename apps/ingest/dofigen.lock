effective: |
  ignore:
  - node_modules
  - /apps/docs
  - /apps/screenshot-service
  - /apps/web
  - /apps/dashboard
  - /apps/status-page
  - /apps/server
  - /apps/workflows
  - /packages/api
  - /packages/proto
  builders:
    install:
      fromImage:
        path: node
        digest: sha256:2fe369e969550cde8e867afc3fe370b260140cab4a23d467074295b42163d553
      label:
        org.opencontainers.image.base.digest: sha256:2fe369e969550cde8e867afc3fe370b260140cab4a23d467074295b42163d553
        org.opencontainers.image.base.name: docker.io/node:24-slim
        org.opencontainers.image.stage: install
      workdir: /app/
      run:
      - corepack enable pnpm
      - pnpm install --prod --frozen-lockfile --filter=@openstatus/ingest... --verbose
      cache:
      - target: /root/.local/share/pnpm/store
      bind:
      - target: pnpm-workspace.yaml
        source: pnpm-workspace.yaml
      - target: pnpm-lock.yaml
        source: pnpm-lock.yaml
      - target: package.json
        source: package.json
      - target: apps/ingest/package.json
        source: apps/ingest/package.json
      - target: packages/alert-adapters/package.json
        source: packages/alert-adapters/package.json
      - target: packages/assertions/package.json
        source: packages/assertions/package.json
      - target: packages/db/package.json
        source: packages/db/package.json
      - target: packages/emails/package.json
        source: packages/emails/package.json
      - target: packages/importers/package.json
        source: packages/importers/package.json
      - target: packages/locales/package.json
        source: packages/locales/package.json
      - target: packages/notifications/base/package.json
        source: packages/notifications/base/package.json
      - target: packages/regions/package.json
        source: packages/regions/package.json
      - target: packages/services/package.json
        source: packages/services/package.json
      - target: packages/subscriptions/package.json
        source: packages/subscriptions/package.json
      - target: packages/theme-store/package.json
        source: packages/theme-store/package.json
      - target: packages/tinybird/package.json
        source: packages/tinybird/package.json
      - target: packages/tsconfig/package.json
        source: packages/tsconfig/package.json
      - target: packages/upstash/package.json
        source: packages/upstash/package.json
      - target: packages/utils/package.json
        source: packages/utils/package.json
    build:
      fromImage:
        path: denoland/deno
        digest: sha256:69a9f3033e3f381770452648b1cbf4ae96ea409f7ef24f30afeff3d380705f62
      label:
        org.opencontainers.image.base.name: docker.io/denoland/deno:2.9.2
        org.opencontainers.image.base.digest: sha256:69a9f3033e3f381770452648b1cbf4ae96ea409f7ef24f30afeff3d380705f62
        org.opencontainers.image.stage: build
      workdir: /app/apps/ingest
      env:
        NODE_ENV: production
      copy:
      - paths:
        - .
        target: /app/
      - fromBuilder: install
        paths:
        - /app/node_modules
        target: /app/node_modules
      - fromBuilder: install
        paths:
        - /app/apps/ingest/node_modules
        target: /app/apps/ingest/node_modules
      - fromBuilder: install
        paths:
        - /app/packages
        target: /app/packages
      run:
      - deno bundle --platform=deno --sloppy-imports --node-modules-dir=manual --output src/_serve.bundle.mjs src/serve.ts
      - deno compile --no-check -A --node-modules-dir=none --output app src/_serve.bundle.mjs
  fromImage:
    host: registry.access.redhat.com
    port: 443
    path: hi/curl
    digest: sha256:848b81ab5d5e55371d7193fd4f1ea7b605d14dbb039344ffad34a4c1f0d880f4
  label:
    org.opencontainers.image.description: Third-party alert webhook ingest for OpenStatus
    org.opencontainers.image.source: https://github.com/openstatusHQ/openstatus
    io.dofigen.version: 2.8.0
    org.opencontainers.image.title: OpenStatus Ingest
    org.opencontainers.image.authors: OpenStatus Team
    org.opencontainers.image.base.digest: sha256:848b81ab5d5e55371d7193fd4f1ea7b605d14dbb039344ffad34a4c1f0d880f4
    org.opencontainers.image.vendor: OpenStatus
  user:
    user: '1000'
    group: '1000'
  copy:
  - fromBuilder: build
    paths:
    - /app/apps/ingest/app
    target: /bin/
    chmod: '555'
  entrypoint:
  - /bin/app
  expose:
  - port: 3004
  healthcheck:
    cmd: '["curl", "-f", "http://localhost:3004/ping"]'
    interval: 30s
    timeout: 10s
    start: 30s
    retries: 3
images:
  docker.io:
    denoland:
      deno:
        2.9.2:
          digest: sha256:69a9f3033e3f381770452648b1cbf4ae96ea409f7ef24f30afeff3d380705f62
    library:
      node:
        24-slim:
          digest: sha256:2fe369e969550cde8e867afc3fe370b260140cab4a23d467074295b42163d553
resources:
  dofigen.yml:
    hash: 61cc1e7b1f0d19efeb5630721fb829107e2db54b453ad517c09cc3434383d111
    content: |
      # Files to exclude from Docker context
      ignore:
        - node_modules
        - /apps/docs
        - /apps/screenshot-service
        - /apps/web
        - /apps/dashboard
        - /apps/status-page
        - /apps/server
        - /apps/workflows
        - /packages/api
        - /packages/proto

      builders:
        # Stage 1: Install production dependencies
        install:
          fromImage: node:24-slim
          workdir: /app/
          labels:
            org.opencontainers.image.stage: install
          bind:
            - pnpm-workspace.yaml
            - pnpm-lock.yaml
            - package.json
            - apps/ingest/package.json
            - packages/alert-adapters/package.json
            - packages/assertions/package.json
            - packages/db/package.json
            - packages/emails/package.json
            - packages/importers/package.json
            - packages/locales/package.json
            - packages/notifications/base/package.json
            - packages/regions/package.json
            - packages/services/package.json
            - packages/subscriptions/package.json
            - packages/theme-store/package.json
            - packages/tinybird/package.json
            - packages/tsconfig/package.json
            - packages/upstash/package.json
            - packages/utils/package.json
          run:
            - corepack enable pnpm
            - pnpm install --prod --frozen-lockfile --filter=@openstatus/ingest... --verbose
          cache:
            - /root/.local/share/pnpm/store

        # Stage 2: Build application (compile to binary with Deno)
        build:
          fromImage: denoland/deno:2.9.2
          workdir: /app/apps/ingest
          labels:
            org.opencontainers.image.stage: build
          env:
            NODE_ENV: production
          copy:
            - . /app/
            - fromBuilder: install
              source: /app/node_modules
              target: /app/node_modules
            - fromBuilder: install
              source: /app/apps/ingest/node_modules
              target: /app/apps/ingest/node_modules
            - fromBuilder: install
              source: /app/packages
              target: /app/packages
          # Same two-step as apps/server: bundle with manual node_modules so pnpm
          # catalog:/workspace: deps resolve, then compile with node-modules-dir=none
          # to keep the binary small. No --minify (it drops deno's createRequire shim).
          run:
            - deno bundle --platform=deno --sloppy-imports --node-modules-dir=manual --output src/_serve.bundle.mjs src/serve.ts
            - deno compile --no-check -A --node-modules-dir=none --output app src/_serve.bundle.mjs

      # Distroless glibc base that already ships curl (for the healthcheck).
      fromImage: registry.access.redhat.com/hi/curl@sha256:848b81ab5d5e55371d7193fd4f1ea7b605d14dbb039344ffad34a4c1f0d880f4

      labels:
        org.opencontainers.image.title: OpenStatus Ingest
        org.opencontainers.image.description: Third-party alert webhook ingest for OpenStatus
        org.opencontainers.image.source: https://github.com/openstatusHQ/openstatus
        org.opencontainers.image.vendor: OpenStatus
        org.opencontainers.image.authors: OpenStatus Team

      copy:
        - fromBuilder: build
          source: /app/apps/ingest/app
          target: /bin/
          chmod: "555"

      user: "1000:1000"

      expose: "3004"

      healthcheck:
        interval: 30s
        timeout: 10s
        start: 30s
        retries: 3
        cmd: '["curl", "-f", "http://localhost:3004/ping"]'

      entrypoint: /bin/app
