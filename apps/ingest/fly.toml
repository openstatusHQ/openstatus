# fly.toml app configuration file for openstatus-ingest
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "openstatus-ingest"
primary_region = "ams"


[build]
  dockerfile = "./Dockerfile"

  [[vm]]
    cpu_kind = "shared"
    cpus = 2
    memory_mb = 512

[http_service]
  internal_port = 3004
  force_https = true
  # The drainer and the staleness sweep run in-process, so a machine that
  # suspends stops draining. Keep one always on.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[http_service.concurrency]
    type = "requests"
    hard_limit = 1000
    soft_limit = 500

[deploy]
  strategy = "bluegreen"

[[http_service.checks]]
  grace_period = "10s"
  interval = "15s"
  method = "GET"
  timeout = "5s"
  path = "/ping"

[env]
  NODE_ENV = "production"
  PORT = "3004"
