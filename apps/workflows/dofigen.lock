resources:
  dofigen.yml:
    hash: 75e561712c38b9cf7ba606bde6d9eaa0c76c6930bc4b5d47ee180e8034e786ca
    content: |
      ignore:
        - node_modules
        - /apps/docs
        - /apps/screenshot-service
        - /apps/server
        - /apps/web
        - /apps/dashboard
        - /apps/status-page
        - /packages/analytics
        - /packages/api
        - /packages/error
        - /packages/tracker
      builders:
        install:
          fromImage: node:26.8.1-slim
          workdir: /app/
          labels:
            org.opencontainers.image.stage: install
          bind:
            - pnpm-workspace.yaml
            - pnpm-lock.yaml
            - package.json
            - apps/workflows/package.json
            - packages/assertions/package.json
            - packages/db/package.json
            - packages/emails/package.json
            - packages/notifications/base/package.json
            - packages/notifications/discord/package.json
            - packages/notifications/email/package.json
            - packages/notifications/grafana-oncall/package.json
            - packages/notifications/google-chat/package.json
            - packages/notifications/ms-teams/package.json
            - packages/notifications/ntfy/package.json
            - packages/notifications/opsgenie/package.json
            - packages/notifications/pagerduty/package.json
            - packages/notifications/slack/package.json
            - packages/notifications/telegram/package.json
            - packages/notifications/bird-whatsapp/package.json
            - packages/notifications/twillio-sms/package.json
            - packages/notifications/webhook/package.json
            - packages/importers/package.json
            - packages/regions/package.json
            - packages/services/package.json
            - packages/subscriptions/package.json
            - packages/utils/package.json
            - packages/tsconfig/package.json
            - packages/tinybird/package.json
            - packages/upstash/package.json
            - packages/theme-store/package.json
            - packages/locales/package.json
            - packages/status-fetcher/package.json

          # Install dependencies scoped to the workflows subgraph (dev included: the build stage needs tsdown)
          run:
            # Node 25+ no longer bundles corepack
            - npm install -g corepack@0.36.0
            - corepack enable pnpm
            - pnpm install --frozen-lockfile --filter=@openstatus/workflows... --loglevel debug
          cache:
            - /root/.local/share/pnpm/store

        # Stage 4: Bundle the app with tsdown into dist/
        build:
          fromImage: node:26.8.1-slim
          workdir: /app/apps/workflows
          labels:
            org.opencontainers.image.stage: build
          copy:
            - . /app/
            - fromBuilder: install
              source: /app/node_modules
              target: /app/node_modules
            - fromBuilder: install
              source: /app/apps/workflows/node_modules
              target: /app/apps/workflows/node_modules
            - fromBuilder: install
              source: /app/packages
              target: /app/packages
          env:
            NODE_ENV: production
          # Everything is inlined except the 3 packages that can't be (see tsdown.config.ts). They ship as
          # a minimal side-car node_modules, installed by npm on the build platform so Fly amd64 gets the
          # right libsql native binary, at the exact versions pnpm resolved.
          run:
            - ./node_modules/.bin/tsdown
            - mkdir -p /tmp/sc /app/data
            - node scripts/sidecar-package.mjs /tmp/sc/package.json
            - npm install --prefix /tmp/sc --omit=dev --no-package-lock --no-audit --no-fund

      # Runtime stage: Node plus curl (healthcheck) and the system CA store, which libsql's native
      # TLS reads — Node's own fetch bundles its CAs, the addon does not.
      fromImage: node:26.8.1-slim
      root:
        run:
          - apt-get update
          - apt-get install -y --no-install-recommends curl ca-certificates
          - rm -rf /var/lib/apt/lists/*
      workdir: /app/

      # Metadata labels
      labels:
        org.opencontainers.image.title: OpenStatus Workflows
        org.opencontainers.image.description: Background job processing and probe scheduling for OpenStatus
        org.opencontainers.image.source: https://github.com/openstatusHQ/openstatus
        org.opencontainers.image.vendor: OpenStatus
        org.opencontainers.image.authors: OpenStatus Team

      env:
        NODE_ENV: production

      # The bundle resolves its externals from the side-car node_modules one level up from dist/
      copy:
        - fromBuilder: build
          source: /app/apps/workflows/dist
          target: /app/apps/workflows/dist
        - fromBuilder: build
          source: /tmp/sc/node_modules
          target: /app/apps/workflows/node_modules
        - fromBuilder: build
          source: /app/data
          target: /app/data

      user: "1000:1000"
      expose: "3000"

      healthcheck:
        interval: 1m
        timeout: 10s
        start: 30s
        retries: 3
        cmd: '["curl", "-f", "http://localhost:3000/ping"]'

      entrypoint: ["node", "/app/apps/workflows/dist/serve.mjs"]
