# fly.toml app configuration file generated for openstatus-workflows on 2024-11-09T11:20:33+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'openstatus-workflows'
primary_region = 'ams'

# Long enough for shutdownOutbox to wait out an in-flight provider call
# (NOTIFICATION_TIMEOUT_MS + 5s) before Fly SIGKILLs.
kill_timeout = "25s"
# serve.ts only handles SIGTERM; Fly defaults to SIGINT.
kill_signal = "SIGTERM"

[build]
  dockerfile = "./Dockerfile"

[[vm]]
  cpu_kind = "shared"
  cpus = 4
  memory_mb = 1024

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 2
  processes = ["app"]

# Past soft_limit the proxy prefers the other machine, so cdg takes overflow
# from ams. hard_limit is set high because Fly has no way to disable it.
[http_service.concurrency]
  type = "requests"
  soft_limit = 5
  hard_limit = 1000

[deploy]
  strategy = "rolling"

[[http_service.checks]]
  grace_period = "30s"
  interval = "1m"
  method = "GET"
  timeout = "10s"
  path = "/ping"

[env]
  NODE_ENV = "production"
  PORT = "3000"

[[mounts]]
    source = "libsql_data"
    destination = "/app/data"
