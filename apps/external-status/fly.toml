# fly.toml app configuration file generated for openstatus-external-status on 2026-11-07T13:59:22+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'openstatus-external-status'
primary_region = 'ams'
kill_signal = 'SIGTERM'
kill_timeout = '1m30s'

[build]
  dockerfile = './Dockerfile'

[deploy]
  strategy = 'rolling'

[env]
  NODE_ENV = 'production'
  PORT = '3000'

# Exactly one always-on machine: ticks are scheduled in-process, so a second
# machine would run every job twice. Deploy with --ha=false to keep it at one.
[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = false
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '1m0s'
    timeout = '10s'
    grace_period = '30s'
    method = 'GET'
    path = '/ping'

[[vm]]
    cpu_kind = "shared"
    cpus = 4
    memory_mb = 1024
