app = 'openstatus-external-status'
primary_region = 'ams'

# serve.ts only handles SIGTERM; Fly defaults to SIGINT.
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "./Dockerfile"

[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory_mb = 1024

# A tick keeps running after the cron request has returned 200, so the machine
# must not be stopped or suspended between requests.
[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[deploy]
  strategy = "rolling"

[[http_service.checks]]
  grace_period = "30s"
  interval = "1m"
  method = "GET"
  timeout = "10s"
  path = "/ping"

[env]
  NODE_ENV = "production"
  PORT = "3000"
