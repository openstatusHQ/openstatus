app = 'openstatus-external-status'
primary_region = 'ams'

# serve.ts only handles SIGTERM; Fly defaults to SIGINT. The timeout covers
# draining an in-flight tick (DRAIN_GRACE_MS in src/serve.ts) plus the flush.
kill_signal = "SIGTERM"
kill_timeout = "90s"

[build]
  dockerfile = "./Dockerfile"

[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory_mb = 1024

# Ticks are scheduled in-process (src/scheduler.ts) and no request ever wakes the
# machine, so it must never stop or suspend. One machine, so each tick runs once.
[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  max_machines_running = 1
  processes = ["app"]

[deploy]
  strategy = "rolling"

[[http_service.checks]]
  grace_period = "30s"
  interval = "1m"
  method = "GET"
  timeout = "10s"
  path = "/ping"

[env]
  NODE_ENV = "production"
  PORT = "3000"
