ignore:
  - node_modules
  - /apps/docs
  - /apps/screenshot-service
  - /apps/server
  - /apps/web
  - /apps/dashboard
  - /apps/status-page
  - /apps/workflows
  - /packages/analytics
  - /packages/api
  - /packages/error
  - /packages/tracker
builders:
  install:
    fromImage: node:26.8.1-slim
    workdir: /app/
    labels:
      org.opencontainers.image.stage: install
    bind:
      - pnpm-workspace.yaml
      - pnpm-lock.yaml
      - package.json
      - apps/external-status/package.json
      - packages/assertions/package.json
      - packages/db/package.json
      - packages/emails/package.json
      - packages/importers/package.json
      - packages/locales/package.json
      - packages/notifications/base/package.json
      - packages/regions/package.json
      - packages/services/package.json
      - packages/status-fetcher/package.json
      - packages/subscriptions/package.json
      - packages/test-utils/package.json
      - packages/theme-store/package.json
      - packages/tinybird/package.json
      - packages/tsconfig/package.json
      - packages/utils/package.json

    # Install dependencies scoped to the external-status subgraph (dev included: the build stage needs tsdown)
    run:
      # Node 25+ no longer bundles corepack
      - npm install -g corepack@0.36.0
      - corepack enable pnpm
      - pnpm install --frozen-lockfile --filter=@openstatus/external-status... --loglevel debug
    cache:
      - /root/.local/share/pnpm/store

  # Bundle the app with tsdown into dist/
  build:
    fromImage: node:26.8.1-slim
    workdir: /app/apps/external-status
    labels:
      org.opencontainers.image.stage: build
    copy:
      - . /app/
      - fromBuilder: install
        source: /app/node_modules
        target: /app/node_modules
      - fromBuilder: install
        source: /app/apps/external-status/node_modules
        target: /app/apps/external-status/node_modules
      - fromBuilder: install
        source: /app/packages
        target: /app/packages
    env:
      NODE_ENV: production
    # Everything is inlined except libsql (see tsdown.config.ts). It ships as a minimal side-car
    # node_modules, installed by npm on the build platform so Fly amd64 gets the right libsql
    # native binary, at the exact versions pnpm resolved.
    run:
      - ./node_modules/.bin/tsdown
      - mkdir -p /tmp/sc
      - node scripts/sidecar-package.mjs /tmp/sc/package.json
      - npm install --prefix /tmp/sc --omit=dev --no-package-lock --no-audit --no-fund

# Runtime stage: Node plus curl (healthcheck) and the system CA store, which libsql's native
# TLS reads — Node's own fetch bundles its CAs, the addon does not.
fromImage: node:26.8.1-slim
root:
  run:
    # One chained command: dofigen emits a heredoc RUN, which doesn't stop on a failed line
    - apt-get update && apt-get install -y --no-install-recommends curl ca-certificates && rm -rf /var/lib/apt/lists/*
workdir: /app/

labels:
  org.opencontainers.image.title: OpenStatus External Status
  org.opencontainers.image.description: Polls third-party status pages for OpenStatus
  org.opencontainers.image.source: https://github.com/openstatusHQ/openstatus
  org.opencontainers.image.vendor: OpenStatus
  org.opencontainers.image.authors: OpenStatus Team

env:
  NODE_ENV: production

# The bundle resolves its externals from the side-car node_modules one level up from dist/
copy:
  - fromBuilder: build
    source: /app/apps/external-status/dist
    target: /app/apps/external-status/dist
    chmod: "555"
  - fromBuilder: build
    source: /tmp/sc/node_modules
    target: /app/apps/external-status/node_modules
    chmod: "555"

user: "1000:1000"
expose: "3000"

healthcheck:
  interval: 1m
  timeout: 10s
  start: 30s
  retries: 3
  cmd: '["curl", "-f", "http://localhost:3000/ping"]'

entrypoint: ["node", "/app/apps/external-status/dist/serve.mjs"]
