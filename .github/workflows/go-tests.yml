name: Go Tests

on:
  push:
    branches:
      - main
    tags:
      - '*.*.*'
  pull_request:
    branches:
      - '**'
    paths:
      - "apps/checker/**"
      - "apps/private-location/**"
      - ".github/workflows/go-tests.yml"

jobs:
  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          # Avoid the libsql bitcode regression until https://go.dev/issue/83136 ships.
          go-version: '1.26.10'
      - name: Run test Checker
        run: go test -timeout 30s -race -count=1 ./...
        working-directory: apps/checker
      - name: Run test Private Location
        run: go test -timeout 30s -race -count=1 ./...
        working-directory: apps/private-location
