name: Proto Generated Files Check
on:
  push:
    branches:
      - "main"
    paths:
      - "packages/proto/**"
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - "packages/proto/**"

permissions:
  contents: read

jobs:
  proto-check:
    name: 🔍 Proto generated files up to date
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v6
        with:
          # breaking check resolves --against against the PR base commit
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: ⎔ Setup node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"

      - name: 🔥 Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 🐹 Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: 📥 Install protoc-gen-connect-openapi
        run: go install github.com/sudorandom/protoc-gen-connect-openapi@latest

      - name: 📥 Download deps
        run: pnpm install

      - name: 🧹 Lint api protos
        working-directory: ./packages/proto
        run: pnpm buf:lint:api

      - name: 🔍 Breaking change check
        if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'buf skip breaking')
        working-directory: ./packages/proto
        run: pnpm exec buf breaking api --against "../../.git#ref=${{ github.event.pull_request.base.sha }},subdir=packages/proto/api"

      - name: 🔄 Regenerate proto files
        working-directory: ./packages/proto
        run: |
          pnpm buf:ts
          pnpm buf:openapi

      - name: 🔍 Check for uncommitted changes
        run: |
          if [ -n "$(git status --porcelain packages/proto/gen/)" ]; then
            echo "::error::Proto generated files are out of date. Run 'pnpm buf:ts && pnpm buf:openapi' in packages/proto and commit the changes."
            git diff --stat packages/proto/gen/
            git diff packages/proto/gen/
            exit 1
          fi
          echo "Proto generated files are up to date."
