name: Fly Deploy Checker
on:
  push:
    branches:
      - main
    paths:
      - "apps/checker/**"
jobs:
  deploy-checker:
    name: Deploy Checker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
      - working-directory: apps/checker
        name: Deploy Checker
        run: |
          flyctl deploy --remote-only --wait-timeout=500
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
