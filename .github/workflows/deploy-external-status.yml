name: Fly Deploy External Status
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-external-status.yml"
      - "apps/external-status/**"
      - "packages/assertions/**"
      - "packages/db/**"
      - "packages/emails/**"
      - "packages/importers/**"
      - "packages/locales/**"
      - "packages/notifications/base/**"
      - "packages/regions/**"
      - "packages/services/**"
      - "packages/status-fetcher/**"
      - "packages/subscriptions/**"
      - "packages/theme-store/**"
      - "packages/tinybird/**"
      - "packages/tsconfig/**"
      - "packages/utils/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
permissions:
  contents: read
jobs:
  deploy-external-status:
    name: Deploy External Status
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
      - run: flyctl deploy --config apps/external-status/fly.toml
          --dockerfile apps/external-status/Dockerfile --remote-only --wait-timeout=500
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
