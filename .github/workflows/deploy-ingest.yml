name: Fly Deploy Ingest
on:
  push:
    branches:
      - main
    paths:
      - "apps/ingest/**"
      - "packages/alert-adapters/**"
      - "packages/services/**"
      - "packages/db/**"
  workflow_dispatch:
jobs:
  deploy:
    name: Deploy Ingest
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run:
          flyctl deploy --config apps/ingest/fly.toml
          --dockerfile  apps/ingest/Dockerfile --remote-only --wait-timeout=500
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
