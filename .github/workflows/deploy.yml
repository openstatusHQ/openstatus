name: Fly Deploy
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy.yml"
      - "apps/server/**"
      - "packages/analytics/**"
      - "packages/assertions/**"
      - "packages/db/**"
      - "packages/emails/**"
      - "packages/error/**"
      - "packages/importers/**"
      - "packages/locales/**"
      - "packages/notifications/**"
      - "packages/proto/**"
      - "packages/regions/**"
      - "packages/services/**"
      - "packages/subscriptions/**"
      - "packages/theme-store/**"
      - "packages/tinybird/**"
      - "packages/tracker/**"
      - "packages/tsconfig/**"
      - "packages/upstash/**"
      - "packages/utils/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
jobs:
  deploy:
    name: Deploy API
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
      - run:
          flyctl deploy --config apps/server/fly.toml
          --dockerfile  apps/server/Dockerfile --remote-only --wait-timeout=500
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
